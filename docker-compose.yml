# STAGE 1: Build the React Application
FROM node:20-alpine AS builder

# Set the working directory inside the container
WORKDIR /app

# Copy package files from the application subdirectory
# Note: The source path points to the 'project' folder inside 'Dashboard web app'
COPY "Dashboard web app/project/package.json" .
COPY "Dashboard web app/project/package-lock.json" .

# Install dependencies (Node dependencies are often used by Sonar/OWASP too)
RUN npm install

# Copy the rest of the application source code
COPY "Dashboard web app/project" .

# Run the build command defined in package.json
# This command generates production-ready static files (usually in a 'dist' folder)
RUN npm run build


# STAGE 2: Serve the Static Assets using a lightweight web server (Nginx)
# We use a multi-stage build to keep the final image size small.
FROM nginx:stable-alpine

# Copy the built files from the builder stage into the Nginx public folder
COPY --from=builder /app/dist /usr/share/nginx/html

# Copy a custom Nginx configuration to handle routing (important for React Router)
# We assume you will add a 'nginx.conf' to your repo root later.
# For now, we use a basic conf.
# RUN rm /etc/nginx/conf.d/default.conf
# COPY nginx.conf /etc/nginx/conf.d/default.conf 

# Expose the default HTTP port
EXPOSE 80

# Command to start Nginx
CMD ["nginx", "-g", "daemon off;"]
